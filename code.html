<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разработка Telegram ботов | Python Developer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 400px; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; font-size: 1.5rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .stack { display: flex; justify-content: center; gap: 10px; margin: 1.5rem 0; }
        .tag { background: #334155; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; color: #e2e8f0; }
        .btn { display: inline-block; background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #7dd3fc; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" width="80" alt="Telegram Logo">
        <h1>Разработка Telegram ботов</h1>
        <p>Создаю умных ботов для бизнеса на Python (Aiogram). Автоматизирую продажи, записи и работу с клиентами.</p>
        <div class="stack">
            <span class="tag">Python</span>
            <span class="tag">Aiogram 3.x</span>
            <span class="tag">SQLite/PostgreSQL</span>
        </div>
        <a href="https://t.me/ТВОЙ_НИК" class="btn">Заказать проект</a>
    </div>
</body>
</html>
